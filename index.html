<!DOCTYPE html>
<html>
<head>
    <title>Sorry Envelope</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="envelope">

            <div class="flap"></div>

            <div class="letter">
                <h2>I'm Sorry! 💗</h2>
                <p>
                    I really am sorry for what happened.
                </p>
                <p>
                    I promise it won't be happening again. 
                    I'll be more careful from now on. 🥺
                </p>
                <p class="love">
                    Please forgive me ❤️
                </p>
            </div>

            <div class="front"></div>

        </div>

        <h1>Sorry 🥺</h1>
        <p class="hint">Hover over the envelope 💌</p>

    </div>

</body>
</html>
